<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPTX | บริษัท เอสพีที เอกซ์ จำกัด (มหาชน)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/css/main.css">
<style>
/* ── HOMEPAGE ONLY ── */
html,body{margin:0;padding:0;background:#222;overflow-y:auto}

/* Navbar — เล็ก เข้ากับพื้นหลัง */
#navbar{background:#222!important;box-shadow:none!important;padding:10px 0!important;z-index:1000!important}
#navbar .nav-logo img{height:46px!important}

/* ── MAIN LAYOUT ── */
.home-page{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  background:#222;
}

/* HERO — image left + logo right */
.home-hero{
  display:flex;
  flex:1;
  min-height:calc(100vh - 56px - 90px); /* viewport minus navbar and footer */
}

/* LEFT: photo */
.hero-img{
  position:relative;
  width:58%;
  flex-shrink:0;
  padding:30px 0 30px 0;
  background:#222;
  overflow:hidden;
}
.hero-img-inner{
  width:100%;
  height:100%;
  overflow:hidden;
  clip-path:polygon(0 0, 86% 0, 100% 100%, 0 100%);
}
.hero-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}
.hero-img .hero-ph{
  width:100%;height:100%;
  background:#1a1a2e;
  display:flex;align-items:center;justify-content:center;
}
.hero-img .hero-ph i{font-size:120px;color:rgba(255,255,255,.05)}

/* RIGHT: logo + name */
.hero-right{
  flex:1;
  background:#222;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:40px 40px;
}
.hero-right .r-logo img{
  max-width:280px;
  display:block;
}
.hero-right .r-logo .logo-fb{
  font-family:'Kanit',sans-serif;font-size:64px;font-weight:700;
  color:#fff;display:none;letter-spacing:2px;
}
.hero-right .r-logo .logo-fb span{color:var(--accent)}
.hero-right h1{
  font-family:'Kanit',sans-serif;
  font-size:22px;font-weight:400;
  color:rgba(255,255,255,.85);
  text-align:center;line-height:1.7;margin:0;
}
.hero-right .eng{
  font-family:'Kanit',sans-serif;font-size:11px;
  letter-spacing:2px;color:rgba(255,255,255,.3);
  text-align:center;
}

/* FOOTER — logo + address / copyright */
.home-footer{
  background:#222;
  border-top:1px solid rgba(255,255,255,.07);
}
.home-footer .hf-main{
  display:flex;align-items:center;
  gap:28px;padding:20px 40px;
  flex-wrap:wrap;
}
.home-footer .hf-logo img{
  height:52px;display:block;
}
.home-footer .hf-logo .logo-fb{
  font-family:'Kanit',sans-serif;font-size:22px;font-weight:700;color:#fff;display:none;
}
.home-footer .hf-logo .logo-fb span{color:var(--accent)}
.home-footer .hf-addr{
  font-family:'Kanit',sans-serif;font-size:13px;
  color:rgba(255,255,255,.45);line-height:1.65;
}
.home-footer .hf-copy{
  border-top:1px solid rgba(255,255,255,.05);
  padding:12px 40px;
  font-family:'Kanit',sans-serif;font-size:12px;
  color:rgba(255,255,255,.25);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
}

@media(max-width:900px){
  .hero-img{display:none}
  .hero-right{padding:80px 24px 40px}
  .home-footer .hf-main,.home-footer .hf-copy{padding:16px 24px}
}
</style>
</head>
<body>
<div id="nav-root"></div>

<div class="home-page">
  <div class="home-hero">
    <!-- LEFT -->
    <div class="hero-img">
      <div class="hero-img-inner">
        <img src="/images/hero.jpg" alt="SPTX"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="hero-ph"><i class="fa-solid fa-city"></i></div>
      </div>
    </div>
    <!-- RIGHT -->
    <div class="hero-right">
      <div class="r-logo">
        <img src="/images/logo_en.png" alt="SPTX"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div class="logo-fb"><span>SPT</span>X</div>
      </div>
      <h1>บริษัท เอสพีที เอกซ์<br>จำกัด (มหาชน)</h1>
      <p class="eng">SPTX PUBLIC COMPANY LIMITED</p>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="home-footer">
    <div class="hf-main">
      <div class="hf-logo">
        <img src="/images/logo_en.png" alt="SPTX"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div class="logo-fb"><span>SPT</span>X</div>
      </div>
      <div class="hf-addr">
        944 สามย่านมิตรทาวน์ ชั้น 28 ถ.พระราม 4<br>
        แขวงวังใหม่ เขตปทุมวัน กรุงเทพมหานคร 10330
      </div>
    </div>
    <div class="hf-copy">
      <span>Copyright &copy; บริษัท เอสพีที เอกซ์ จำกัด (มหาชน)</span>
      <span>SPTX Public Company Limited</span>
    </div>
  </div>
</div>

<script src="/js/layout.js"></script>
<script>
document.getElementById('footer-root').style.display='none';
const btt = document.querySelector('#btt');
if(btt) btt.style.display='none';
</script>
<script src="/js/main.js"></script>
</body>
</html>
